name: Bug report
description: Something in Brainitive Desktop does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems: do not use this form, see SECURITY.md.
        Please remove anything private (server addresses you do not want public, names) from what you paste.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows 10, Windows 11, Linux (AppImage), Linux (.deb)]
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: macOS 15.1 / Windows 11 23H2 / Ubuntu 24.04
  - type: input
    id: version
    attributes:
      label: App version
      description: Help → Copy Diagnostics shows it in the first lines (on macOS also Brainitive → About).
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: server
    attributes:
      label: Server
      options: [Brainitive Cloud, Self-hosted]
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server version (self-hosted)
      placeholder: v1.49.0
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened instead
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Help → Copy Diagnostics (versions, OS, webview, server, last log lines; tokens and cookies are removed), then paste it here.
      render: text
