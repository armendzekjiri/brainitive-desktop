name: Build

# Installers for macOS (universal), Windows (x64, NSIS) and Linux (x64, AppImage + .deb), and the
# Microsoft Store package (x64 MSIX, job "msstore", BRAI-442) for tags and manual runs.
#   - pull request: tests only, no bundles
#   - tag v*:       tests, bundles, a DRAFT GitHub release with the installers + SHA256SUMS
#   - manual run:   tests + bundles as workflow artifacts (no release)
#   - a pre-release published by hand: its latest.json becomes the beta channel's manifest
# Signing is optional: every signing step only runs when its secrets exist, so the workflow
# produces unsigned installers until they are added. See docs/RELEASING.md.
# Signing runs only for a v* tag push or a manual run on the default branch (SIGNING_ALLOWED);
# pull requests and other refs never see a signing secret. Secrets are passed per step through
# `env:` to the steps that use them, never written to $GITHUB_ENV (BRAI-377).
# Auto-updates (BRAI-373): with TAURI_SIGNING_PRIVATE_KEY, signing builds also make signed
# updater bundles and the draft release gets latest.json; without it they are skipped, nothing
# fails. The bundles are built WITHOUT the key; a separate step after the build signs them with
# `tauri signer sign`, and only that step gets the key.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # whisper.cpp (voice capture) is built from source: portable baseline, see src-tauri/.cargo/config.toml
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    env:
      SIGNING_ALLOWED: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: macos
            bundle-glob: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            updater-glob: src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          - name: Windows (x64)
            os: windows-2022
            args: --bundles nsis
            rust-targets: ""
            artifact: windows
            bundle-glob: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
            updater-glob: src-tauri/target/release/bundle/nsis/*-setup.exe
          - name: Linux (x64)
            os: ubuntu-22.04
            args: --bundles deb,appimage
            rust-targets: ""
            artifact: linux
            bundle-glob: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/deb/*.deb.sig
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
            updater-glob: src-tauri/target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # webkit2gtk-4.1 + ayatana appindicator (tray), librsvg, patchelf (AppImage), libasound2-dev
      # (cpal / ALSA, voice capture), libdbus-1-dev (keyring). cmake and a C++ compiler are on all runners.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libdbus-1-dev pkg-config libasound2-dev libssl-dev xdg-utils

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@7dcc700092a1a8b9c17ba0e140b4e34e93000946 # 1.90.0
        with:
          components: clippy
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run build

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      # ---- signing: each block runs only when signing is allowed and its secrets exist ---------
      # Booleans only: no secret value leaves this step.
      - name: Detect signing secrets
        id: signing
        if: env.SIGNING_ALLOWED == 'true'
        shell: bash
        env:
          HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_NOTARY_ID: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
          HAS_APPLE_NOTARY_KEY: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY_P8 != '' }}
          HAS_AZURE: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT != '' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT != '' && secrets.AZURE_TRUSTED_SIGNING_PROFILE != '' }}
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          {
            echo "apple=$HAS_APPLE"
            echo "apple_notary_id=$HAS_APPLE_NOTARY_ID"
            echo "apple_notary_key=$HAS_APPLE_NOTARY_KEY"
            echo "azure=$HAS_AZURE"
            echo "updater=$HAS_UPDATER_KEY"
          } >> "$GITHUB_OUTPUT"

      # Notarization with an App Store Connect API key (used when the Apple ID option is absent):
      # notarytool needs the .p8 as a file. It goes to the runner's temp folder, mode 0600, and is
      # deleted after the build; only its path is an output.
      - name: macOS notarization key file
        id: notary_key
        if: runner.os == 'macOS' && steps.signing.outputs.apple == 'true' && steps.signing.outputs.apple_notary_id != 'true' && steps.signing.outputs.apple_notary_key == 'true'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "path=$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_OUTPUT"

      # Windows: Azure Trusted Signing through trusted-signing-cli (pinned), wired up with a config
      # overlay written here (tauri.conf.json stays unsigned so local builds never need Azure). The
      # Azure credentials go to the tauri build step only (its signCommand runs the CLI).
      - name: Windows signing (Azure Trusted Signing)
        id: winsign
        if: runner.os == 'Windows' && steps.signing.outputs.azure == 'true'
        shell: bash
        env:
          ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          cargo install trusted-signing-cli --version 0.11.0 --locked
          printf '{"bundle":{"windows":{"signCommand":"trusted-signing-cli -e %s -a %s -c %s -d Brainitive %%1"}}}' \
            "$ENDPOINT" "$ACCOUNT" "$PROFILE" > "$RUNNER_TEMP/sign.conf.json"
          echo "config=$RUNNER_TEMP/sign.conf.json" >> "$GITHUB_OUTPUT"

      # Bundles are not built for pull requests. No updater key here: tauri.conf.json keeps
      # createUpdaterArtifacts off, the updater bundles are signed in the next step. Each Apple /
      # Azure variable is empty unless this runner signs (signing allowed, secret present, right
      # OS); empty ones are unset, because Tauri treats a set-but-empty variable as set.
      - name: tauri build
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SIGN_CONFIG: ${{ steps.winsign.outputs.config }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && steps.signing.outputs.apple == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && steps.signing.outputs.apple == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && steps.signing.outputs.apple == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          # notarization option A: Apple ID + app-specific password
          APPLE_ID: ${{ runner.os == 'macOS' && steps.signing.outputs.apple == 'true' && steps.signing.outputs.apple_notary_id == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && steps.signing.outputs.apple == 'true' && steps.signing.outputs.apple_notary_id == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && steps.signing.outputs.apple == 'true' && steps.signing.outputs.apple_notary_id == 'true' && secrets.APPLE_TEAM_ID || '' }}
          # option B: App Store Connect API key (the file from the step above)
          APPLE_API_KEY: ${{ steps.notary_key.outputs.path != '' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ steps.notary_key.outputs.path != '' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY_PATH: ${{ steps.notary_key.outputs.path }}
          AZURE_TENANT_ID: ${{ steps.winsign.outputs.config != '' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ steps.winsign.outputs.config != '' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.winsign.outputs.config != '' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID \
            APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH \
            AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            [ -n "${!name}" ] || unset "$name"
          done
          configs=()
          [ -n "$SIGN_CONFIG" ] && configs+=(--config "$SIGN_CONFIG")
          npx tauri build ${{ matrix.args }} "${configs[@]}"

      - name: Remove the notarization key file
        if: always() && steps.notary_key.outputs.path != ''
        shell: bash
        env:
          KEY_FILE: ${{ steps.notary_key.outputs.path }}
        run: rm -f "$KEY_FILE"

      # Updater bundles (BRAI-373), signed AFTER the build so the updater key never reaches the
      # build (npm scripts, build.rs of every crate). Only this step gets the key. The bundle is
      # bound to the app version (`--app-version`, the signed trusted comment that
      # requireSignedVersion checks), like `tauri build` does. Skipped while tauri.conf.json still
      # has the placeholder public key: such an app never updates, signed bundles would be useless.
      #   macOS:   Brainitive.app → Brainitive.app.tar.gz (the app at the archive's top level, the
      #            layout the updater unpacks), then signed
      #   Windows: the NSIS *-setup.exe itself; Linux: the .AppImage and the .deb themselves
      - name: Updater signing
        id: updater
        if: env.SIGNING_ALLOWED == 'true' && github.event_name != 'pull_request' && steps.signing.outputs.updater == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if grep -q '"pubkey": "PLACEHOLDER' src-tauri/tauri.conf.json; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is set but tauri.conf.json still has the placeholder updater key: no updater bundles"
            exit 0
          fi
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          shopt -s nullglob
          if [ "$RUNNER_OS" = "macOS" ]; then
            apps=(src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
            [ ${#apps[@]} -eq 1 ] || { echo "::error::expected one .app, found ${#apps[@]}"; exit 1; }
            # COPYFILE_DISABLE: no AppleDouble ._ files in the archive
            COPYFILE_DISABLE=1 tar -czf "${apps[0]}.tar.gz" -C "$(dirname "${apps[0]}")" "$(basename "${apps[0]}")"
          fi
          bundles=(${{ matrix.updater-glob }})
          [ ${#bundles[@]} -eq 1 ] || { echo "::error::expected one updater bundle, found ${#bundles[@]}"; exit 1; }
          # Linux: the .deb is an updater bundle too (latest.json's linux-x86_64-deb)
          extra=()
          [ "$RUNNER_OS" = "Linux" ] && extra=(src-tauri/target/release/bundle/deb/*.deb)
          for file in "${bundles[0]}" "${extra[@]}"; do
            npx tauri signer sign --app-version "$version" "$file"
            [ -s "$file.sig" ] || { echo "::error::no signature written for $file"; exit 1; }
          done
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # The bundle CI just signed must verify with the public key in tauri.conf.json, the way the
      # shipped app checks it (signature and signed version); a mismatched key pair would ship a
      # release nobody can update to.
      - name: Check the updater signature
        if: steps.updater.outputs.signed == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(${{ matrix.updater-glob }})
          [ ${#bundles[@]} -eq 1 ] || { echo "::error::expected one updater bundle, found ${#bundles[@]}"; exit 1; }
          cd src-tauri
          BRAINITIVE_UPDATER_ARTIFACT="$GITHUB_WORKSPACE/${bundles[0]}" \
            cargo test --locked --lib ci_signed_bundle_verifies_with_the_committed_key -- --ignored

      - name: Upload installers
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.artifact }}
          path: ${{ matrix.bundle-glob }}
          if-no-files-found: error
          retention-days: 14

  # Microsoft Store package (BRAI-442, docs/MICROSOFT-STORE.md): the msstore variant (no updater,
  # Store links, startup task) as an UNSIGNED x64 MSIX for Partner Center, which signs it. No
  # secrets: -SignForTest signs a separate sideload copy with a self-signed certificate made on
  # the runner (its private key is deleted right after). Tags with a pre-release part
  # (v1.0.0-beta.1) are skipped: an MSIX version is X.Y.Z.0, the Store has no betas of its own.
  msstore:
    name: Microsoft Store (MSIX)
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@7dcc700092a1a8b9c17ba0e140b4e34e93000946 # 1.90.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: msstore

      - run: npm ci
      - run: npm run build

      # the manifest renderer and the logo generator (identity = MICROSOFT-STORE-LISTING.md)
      - name: Packaging script tests
        run: node --test scripts/

      - name: cargo test (msstore)
        working-directory: src-tauri
        run: cargo test --locked --features msstore

      - name: cargo clippy (msstore)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --features msstore -- -D warnings

      # tauri build --no-bundle --features msstore --config tauri.msstore.conf.json, then the
      # package folder, makepri and makeappx pack (which fails on a manifest schema error)
      - name: Build the MSIX
        id: msix
        shell: pwsh
        run: ./scripts/build-msix.ps1 -SignForTest

      # The Windows App Certification Kit, when the runner image has it: installs the sideload
      # copy and runs the Store's checks. Informational (it can't fail the job); run it by hand
      # before a submission anyway (docs/MICROSOFT-STORE.md).
      - name: Windows App Certification Kit
        id: wack
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        env:
          SIDELOAD: ${{ steps.msix.outputs.sideload }}
          CER: ${{ steps.msix.outputs.cer }}
        run: |
          $appcert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $appcert)) {
            Write-Host "::notice::appcert.exe is not on this runner: run WACK by hand (docs/MICROSOFT-STORE.md)"
            exit 0
          }
          Import-Certificate -FilePath $env:CER -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $report = Join-Path $env:RUNNER_TEMP "wack-report.xml"
          & $appcert reset
          & $appcert test -appxpackagepath $env:SIDELOAD -reportoutputpath $report
          $code = $LASTEXITCODE
          if (Test-Path $report) {
            $result = ([xml](Get-Content $report -Raw)).REPORT.OVERALL_RESULT
            Write-Host "WACK overall result: $result"
            if ($result -ne "PASS") { Write-Host "::warning::WACK result ${result}, see the msstore-wack-report artifact" }
          }
          exit $code

      - name: Upload the WACK report
        if: always() && steps.wack.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msstore-wack-report
          path: ${{ runner.temp }}/wack-report.xml
          if-no-files-found: ignore
          retention-days: 14

      # not "installers-*": an unsigned MSIX can't be installed by users, so it is never attached
      # to the GitHub release; it is downloaded from this run and uploaded to Partner Center
      - name: Upload the MSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msstore-package
          path: ${{ steps.msix.outputs.msix }}
          if-no-files-found: error
          retention-days: 14

      # the self-signed copy for sideload tests; never attached to a release or uploaded to the Store
      - name: Upload the sideload test copy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msstore-sideload-test
          path: |
            ${{ steps.msix.outputs.sideload }}
            ${{ steps.msix.outputs.cer }}
          if-no-files-found: error
          retention-days: 14

  # Runs when the installers built. The Store package (msstore job) is separate: a failure there
  # never blocks the GitHub release, and the MSIX is not attached to it.
  release:
    name: Draft release
    if: >-
      !cancelled() && github.ref_type == 'tag' && github.event_name == 'push' &&
      needs.build.result == 'success'
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      # latest.json (Tauri's static manifest) from the signed updater bundles; their .sig files
      # go into the manifest, not into the release. No signed bundles: no manifest.
      - name: Updater manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set +e
          node scripts/updater-manifest.mjs installers "$TAG" "$GITHUB_REPOSITORY" \
            "Brainitive Desktop $TAG — see the release notes on GitHub." > latest.json
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            mv latest.json installers/latest.json
          elif [ $code -eq 2 ]; then
            echo "::notice::no signed updater bundles: this release has no latest.json (no auto-update to it)"
            rm -f latest.json
          else
            exit $code
          fi
          rm -f installers/*.sig

      - name: Checksums
        working-directory: installers
        run: sha256sum * > SHA256SUMS

      # A draft: the owner reviews it and publishes by hand (docs/RELEASING.md). Tags with a
      # pre-release part (v1.0.0-beta.1) become pre-releases: GitHub's "latest" (the stable
      # channel) never points at them.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag "${prerelease[@]}" \
            --title "Brainitive Desktop $TAG" --notes "See CHANGELOG.md. Unsigned builds show a Gatekeeper / SmartScreen warning. The .msix is the unsigned Microsoft Store upload for Partner Center, not an installer: get Brainitive for Windows from the Store or the -setup.exe."

  # Beta channel (BRAI-373): when the owner publishes a pre-release, its latest.json becomes
  # beta.json of the rolling pre-release "updater-beta" (created on first use, always kept a
  # pre-release so it never becomes "latest"). Stable needs nothing: releases/latest/download/
  # latest.json follows the newest published stable release by itself.
  beta-manifest:
    name: Beta channel manifest
    if: github.event_name == 'release' && github.event.release.prerelease && github.event.release.tag_name != 'updater-beta'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish beta.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir manifest
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir manifest; then
            echo "::notice::$TAG has no latest.json (no updater signing key at build time): beta channel unchanged"
            exit 0
          fi
          mv manifest/latest.json manifest/beta.json
          if ! gh release view updater-beta --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create updater-beta --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Beta update channel" \
              --notes "Holds beta.json for the app's beta channel. Not a release: do not delete or mark as latest."
          fi
          gh release edit updater-beta --repo "$GITHUB_REPOSITORY" --prerelease --latest=false
          gh release upload updater-beta manifest/beta.json --repo "$GITHUB_REPOSITORY" --clobber
