<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brainitive</title>
    <link rel="stylesheet" href="/src/panel.css" />
    <script type="module" src="/src/panel.ts"></script>
  </head>
  <!-- The menu-bar panel: a bundled page. Every value comes from the panel's own Rust commands
       (capabilities/panel.json); no token, no URL, server text set with textContent only. -->
  <body>
    <div id="panel" class="panel" hidden>
      <header class="head">
        <span id="dot" class="dot" aria-hidden="true"></span>
        <span id="host" class="host"></span>
        <span id="sync" class="sync"></span>
      </header>

      <nav id="tabs" class="tabs" role="tablist" aria-label="Panel">
        <button id="tab-today" class="tab" role="tab" data-tab="today" aria-controls="content" title="Today (⌘1)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="2.5" /><path d="M3 8h14M7 2.5v3M13 2.5v3" /><circle cx="10" cy="12.5" r="1.6" class="fill" /></svg>
          <span>Today</span>
        </button>
        <button id="tab-my_day" class="tab" role="tab" data-tab="my_day" aria-controls="content" title="My Day (⌘2)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.4" /><path d="M10 2.5v1.8M10 15.7v1.8M2.5 10h1.8M15.7 10h1.8M4.7 4.7l1.3 1.3M14 14l1.3 1.3M4.7 15.3 6 14M14 6l1.3-1.3" /></svg>
          <span>My Day</span>
        </button>
        <button id="tab-assigned" class="tab" role="tab" data-tab="assigned" aria-controls="content" title="Assigned to me (⌘3)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.5" y="3" width="13" height="14.5" rx="2.5" /><path d="m6.8 8 1.4 1.4L10.8 6.8M6.8 13.2l1.4 1.4 2.6-2.6M12.5 8.4h1.5M12.5 13.6h1.5" /></svg>
          <span>Assigned</span>
        </button>
        <button id="tab-notifications" class="tab" role="tab" data-tab="notifications" aria-controls="content" title="Notifications (⌘4)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 13.5V9a5 5 0 0 1 10 0v4.5l1.5 1.8h-13zM8.2 17.2a2 2 0 0 0 3.6 0" /></svg>
          <span>Inbox</span>
          <span id="badge" class="badge" hidden></span>
        </button>
        <button id="tab-timer" class="tab" role="tab" data-tab="timer" aria-controls="content" title="Timer (⌘5)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="11" r="6.3" /><path d="M10 7.6V11l2.3 1.5M8 2.5h4M15.3 5.2l1.2-1.2" /></svg>
          <span>Timer</span>
        </button>
      </nav>

      <main id="content" class="content" role="tabpanel" tabindex="-1">
        <div id="inner" class="inner"></div>
      </main>

      <footer class="foot">
        <button class="foot-btn" data-run="task" type="button">New Task</button>
        <span class="sep" aria-hidden="true">·</span>
        <button class="foot-btn" data-run="capture" type="button" title="Quick capture">Capture</button>
        <span class="sep" aria-hidden="true">·</span>
        <button class="foot-btn" data-run="open" type="button">Open Brainitive</button>
        <span class="sep" aria-hidden="true">·</span>
        <button class="foot-btn" data-run="settings" type="button">Settings</button>
      </footer>
    </div>

    <div id="signed-out" class="panel signed-out" hidden>
      <img src="/logo.png" alt="" width="40" height="40" />
      <strong id="so-title">Sign in to Brainitive</strong>
      <p id="so-text" class="muted">See today, your work, notifications and the timer right here.</p>
      <button id="so-button" class="primary" type="button">Open Brainitive</button>
    </div>
  </body>
</html>
