[package]
name = "brainitive-desktop"
version = "1.0.0-beta.2"
description = "Brainitive Desktop: the native shell for a Brainitive instance (Cloud or self-hosted)"
authors = ["Armend Zekjiri (Brainitive)"]
license-file = "../LICENSE"
repository = "https://github.com/armendzekjiri/brainitive-desktop"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
# `_lib` suffix: avoids the bin/lib name clash on Windows (cargo#8519).
name = "brainitive_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "unstable"] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-clipboard-manager = "=2.5.0"
# auto-updater (BRAI-373): minisign-signed bundles, used from Rust only (no JS permissions)
tauri-plugin-updater = "=2.14.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "=1.54.1", features = ["sync", "time", "macros", "net"] }
url = "=2.5.8"
sha2 = "=0.11.1"
base64 = "=0.23.1"
rand = "=0.10.3"
semver = "=1.0.28"
thiserror = "=2.0.21"
keyring = "=4.2.0"
log = "0.4"
# voice capture (BRAI-439): microphone input and on-device speech-to-text (whisper.cpp, built
# from source by whisper-rs-sys: needs cmake and libclang). Metal on macOS, see below.
cpal = "=0.18.2"
whisper-rs = { version = "=0.16.0", features = ["log_backend"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Metal (GPU) for whisper.cpp on macOS; AVFoundation microphone permission through objc2
whisper-rs = { version = "=0.16.0", features = ["log_backend", "metal"] }
objc2 = "=0.6.5"
block2 = "=0.6.2"
# downloads (BRAI-377): setxattr / getxattr for the com.apple.quarantine flag
libc = "=0.2.191"

# The Microsoft Store build (BRAI-442, docs/MICROSOFT-STORE.md): `--features msstore` with
# `--config tauri.msstore.conf.json`. Both crates are already in the tree (tauri, notify-rust): the
# WinRT StartupTask / package APIs and toasts with the package's AUMID.
[target.'cfg(windows)'.dependencies]
# the main window's keyboard shortcuts inside its WebView2 children (keys.rs); wry's version
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["ApplicationModel", "ApplicationModel_Activation", "Foundation"], optional = true }
tauri-winrt-notification = { version = "=0.8.1", optional = true }

[features]
# No updater (the Store updates the app), Store links, the MSIX startup task, package toasts.
msstore = ["dep:windows", "dep:tauri-winrt-notification"]

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros"] }
# updater tests (BRAI-373): a mock app for the plugin, a throwaway minisign key made in the test
tauri = { version = "=2.12.5", features = ["tray-icon", "test"] }
minisign = "=0.9.1"

# Release profile, see docs/PERFORMANCE.md. Everything heavy (rendering, JS) is in the system
# webview, so Rust speed hardly matters; binary size and start-up do.
[profile.release]
codegen-units = 1   # one unit: the optimiser sees the whole crate (slower build, smaller + faster code)
lto = true          # link-time optimisation across all crates, drops unused code
opt-level = "s"     # optimise for size: fewer pages to map at launch; "3" gains nothing measurable here
panic = "abort"     # no unwinding tables; our panic hook (logging.rs) still runs before the abort
strip = true        # no symbols: ~half the binary size (backtraces in logs show addresses only)
