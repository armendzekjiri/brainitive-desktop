<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Task</title>
    <link rel="stylesheet" href="/src/native.css" />
    <link rel="stylesheet" href="/src/popup.css" />
    <link rel="stylesheet" href="/src/task.css" />
    <link rel="stylesheet" href="/src/motion.css" />
    <script type="module" src="/src/task.ts"></script>
  </head>
  <body class="popup task-body">
    <div id="app" class="task">
      <header class="popup-head">
        <img src="/logo.png" alt="" width="18" height="18" />
        <strong>New task</strong>
        <span id="where" class="muted"></span>
        <span class="spacer"></span>
        <kbd>Esc</kbd>
      </header>

      <form id="form" class="task-form" novalidate>
        <div class="dest">
          <div class="field grow">
            <label class="field-label" for="project">Project</label>
            <div class="combo">
              <input
                id="project"
                type="text"
                role="combobox"
                aria-expanded="false"
                aria-controls="project-list"
                aria-autocomplete="list"
                autocomplete="off"
                spellcheck="false"
                placeholder="Search projects…"
              />
              <span class="combo-caret" aria-hidden="true">▾</span>
              <ul id="project-list" class="combo-list" role="listbox" aria-label="Projects" hidden></ul>
            </div>
            <p class="field-error" data-for="project" hidden></p>
          </div>
          <div id="board-field" class="field" hidden>
            <label class="field-label" for="board">Board</label>
            <select id="board"></select>
            <p class="field-error" data-for="board" hidden></p>
          </div>
        </div>

        <div class="field">
          <input id="title" class="title-input" type="text" maxlength="255" autocomplete="off" placeholder="What needs to be done?" aria-label="Title" />
          <p class="field-error" data-for="title" hidden></p>
        </div>

        <div class="field">
          <button id="desc-toggle" class="disclosure" type="button" aria-expanded="false" aria-controls="description">
            <span class="disclosure-caret" aria-hidden="true">▸</span> Description
          </button>
          <textarea id="description" rows="5" placeholder="Details, in Markdown" aria-label="Description" hidden></textarea>
          <p class="field-error" data-for="description" hidden></p>
        </div>

        <div class="field">
          <span class="field-label" id="priority-label">Priority</span>
          <div id="priorities" class="chips" role="radiogroup" aria-labelledby="priority-label"></div>
          <p class="field-error" data-for="priority" hidden></p>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>
        <p class="field-error" data-for="type" hidden></p>

        <div class="actions">
          <div id="type-field" class="type-field" hidden>
            <label class="field-label" for="type">Type</label>
            <select id="type"></select>
          </div>
          <span class="spacer"></span>
          <button id="inbox" type="button" hidden>Save to Inbox instead</button>
          <button id="create" class="primary" type="submit">Create <kbd class="on-accent" id="create-keys"></kbd></button>
        </div>
      </form>

      <section id="done" class="done" hidden>
        <div class="done-mark" aria-hidden="true">✓</div>
        <p class="done-title"><span id="done-key"></span> <span id="done-verb">created</span></p>
        <p id="done-name" class="done-name muted"></p>
        <div class="done-actions">
          <button id="again" type="button">New another</button>
          <button id="open" class="primary" type="button">Open <kbd class="on-accent">↩</kbd></button>
        </div>
      </section>

      <section id="blocked" class="blocked" hidden>
        <img src="/logo.png" alt="" width="40" height="40" />
        <h2 id="blocked-title">Sign in to Brainitive</h2>
        <p id="blocked-text" class="muted"></p>
        <button id="blocked-button" class="primary" type="button">Open Brainitive</button>
      </section>
    </div>
  </body>
</html>
