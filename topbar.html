<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brainitive</title>
    <link rel="stylesheet" href="/src/topbar.css" />
    <link rel="stylesheet" href="/src/motion.css" />
    <script type="module" src="/src/topbar.ts"></script>
  </head>
  <!-- The main window's top bar, laid out like Windows 11 Notepad: the tabs in the title bar row,
       the menus in a row below that the active tab flows into. A bundled page
       (capabilities/topbar.json): it gets tab labels, titles and icon kinds from Rust and sends
       clicks back; no token, no URL. Server text is set with textContent only. -->
  <body>
    <header class="titlebar" data-drag>
      <img class="logo" src="/logo.png" alt="" width="16" height="16" draggable="false" />
      <div id="title" class="title" data-drag hidden></div>

      <div id="tabs" class="tabs" role="tablist" aria-label="Tabs" data-drag></div>
      <button id="new-tab" class="new-tab" type="button" title="New tab (Ctrl+T)" aria-label="New tab" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
      </button>
      <div class="spacer" data-drag></div>

      <div id="controls" class="controls" hidden>
        <button class="ctl" data-win="minimize" type="button" aria-label="Minimize" title="Minimize">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" /></svg>
        </button>
        <button id="max" class="ctl" data-win="maximize" type="button" aria-label="Maximize" title="Maximize">
          <svg id="max-icon" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" rx="1.5" /></svg>
          <svg id="restore-icon" viewBox="0 0 10 10" aria-hidden="true" hidden><rect x="0.5" y="2.5" width="7" height="7" rx="1.5" /><path d="M2.5 2.5V2a1.5 1.5 0 0 1 1.5-1.5h4A1.5 1.5 0 0 1 9.5 2v4A1.5 1.5 0 0 1 8 7.5h-.5" /></svg>
        </button>
        <button class="ctl close" data-win="close" type="button" aria-label="Close" title="Close">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="m0.5 0.5 9 9M9.5 0.5l-9 9" /></svg>
        </button>
      </div>
    </header>

    <div class="menubar">
      <nav id="menus" class="menus" aria-label="App menu"></nav>
      <button id="menu-all" class="menu-btn menu-all" type="button" title="Menu" aria-label="Menu">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" /></svg>
      </button>

      <div id="nav" class="nav" hidden>
        <span class="sep" aria-hidden="true"></span>
        <button class="icon-btn" data-nav="back" type="button" title="Back (Ctrl+[)" aria-label="Back">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" /></svg>
        </button>
        <button class="icon-btn" data-nav="forward" type="button" title="Forward (Ctrl+])" aria-label="Forward">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3.5 4.5 4.5L6 12.5" /></svg>
        </button>
        <button class="icon-btn" data-nav="reload" type="button" title="Reload (Ctrl+R)" aria-label="Reload">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.8v2.9h-2.9" /></svg>
        </button>
      </div>

      <div class="grow"></div>

      <button id="server" class="server" type="button" title="Switch server" aria-haspopup="menu" hidden>
        <span id="server-dot" class="dot" aria-hidden="true"></span>
        <span id="server-name" class="server-name"></span>
        <svg class="caret" viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 6.5 3.5 3.5 3.5-3.5" /></svg>
      </button>
    </div>
  </body>
</html>
